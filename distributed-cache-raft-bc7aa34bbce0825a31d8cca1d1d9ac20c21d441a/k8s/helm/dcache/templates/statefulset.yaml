apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dcache
spec:
  serviceName: dcache
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dcache
  template:
    metadata:
      labels:
        app: dcache
    spec:
      containers:
      - name: dcache
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 50051
        - containerPort: 8001
        command: ["python","-m","cmd.node"]
        args: ["--node-id=$(POD_NAME)","--port=50051","--metrics-port=8001"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
