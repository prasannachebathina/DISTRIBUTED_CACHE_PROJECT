apiVersion: apps/v1
kind: Deployment
metadata:
  name: node1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node1
  template:
    metadata:
      labels:
        app: node1
    spec:
      containers:
      - name: dcache
        image: dcache:latest
        imagePullPolicy: Never
        command:
        - "python"
        - "-m"
        - "cli.node"
        args:
        - "--node-id=node1"
        - "--port=50051"
        - "--metrics-port=8001"
        - "--peers=node2,node3"

