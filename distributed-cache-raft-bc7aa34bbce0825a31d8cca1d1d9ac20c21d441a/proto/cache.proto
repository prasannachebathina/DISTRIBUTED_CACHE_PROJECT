syntax = "proto3";
package dcache;

service CacheService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message GetRequest { string key = 1; }
message GetResponse { bool found = 1; string value = 2; string node_id = 3; }

message SetRequest {
  string key = 1;
  string value = 2;
  int64 ttl_seconds = 3;
  string request_id = 4;
}
message SetResponse {
  bool ok = 1;
  string node_id = 2;
  string leader_id = 3;
  int64 commit_index = 4;
}

message DeleteRequest { string key = 1; string request_id = 2; }
message DeleteResponse {
  bool ok = 1;
  string node_id = 2;
  string leader_id = 3;
  int64 commit_index = 4;
}

message HealthRequest {}
message HealthResponse { bool ok = 1; string node_id = 2; }

message StatusRequest {}
message StatusResponse {
  string node_id = 1;
  string role = 2;
  string leader_id = 3;
  int64 term = 4;
  int64 commit_index = 5;
}
message RequestVoteRequest {
  int64 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated string entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
message GetLogRequest {
  int64 term = 1;
  string node_id = 2;
}

message GetLogResponse {
  int64 term = 1;
  repeated string entries = 2;
  int64 commit_index = 3;
}

service RecoveryService {
  rpc GetLog(GetLogRequest) returns (GetLogResponse);
}
